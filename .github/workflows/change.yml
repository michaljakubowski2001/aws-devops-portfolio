name: Reviewed infrastructure change
on:
  workflow_call:
    inputs:
      destroy:
        required: true
        type: boolean
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-devops-portfolio-state
  cancel-in-progress: false
env:
  AWS_REGION: eu-central-1
  STATE_BUCKET: ${{ vars.STATE_BUCKET }}
  TRANSFER_BUCKET: ${{ vars.TRANSFER_BUCKET }}
  TF_VAR_instance_profile_name: ${{ vars.INSTANCE_PROFILE_NAME }}
  TF_IN_AUTOMATION: 'true'
jobs:
  plan:
    if: github.ref == 'refs/heads/main' && vars.AWS_READY == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: portfolio-plan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: bash scripts/backend.sh
      - name: Save the exact plan for approval
        env:
          DESTROY: ${{ inputs.destroy }}
        shell: bash
        run: |
          mkdir -p .artifacts
          args=()
          if [[ "$DESTROY" == true ]]; then args+=(-destroy); fi
          terraform -chdir=infra plan -input=false -lock-timeout=120s "${args[@]}" -out=../.artifacts/approved.tfplan
          terraform -chdir=infra show -no-color ../.artifacts/approved.tfplan > .artifacts/plan.txt
          printf '%s\n' "$GITHUB_SHA" > .artifacts/commit.txt
          sha256sum .artifacts/approved.tfplan > .artifacts/plan.sha256
          {
            echo '## Review this plan before approving production'
            echo 'Download the reviewed-plan artifact for the complete plan. Approval applies this saved plan, not a new one.'
            echo '```text'
            tail -c 50000 .artifacts/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-plan
          path: .artifacts/
          retention-days: 1
          include-hidden-files: true
  apply:
    needs: plan
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: reviewed-plan
          path: .artifacts/
      - name: Verify plan identity
        run: |
          test "$(cat .artifacts/commit.txt)" = "$GITHUB_SHA"
          sha256sum -c .artifacts/plan.sha256
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: portfolio-deploy-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: bash scripts/backend.sh
      - name: Apply only the approved saved plan
        run: terraform -chdir=infra apply -input=false -lock-timeout=120s ../.artifacts/approved.tfplan
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: ${{ !inputs.destroy }}
        with:
          python-version: '3.13'
      - name: Install Ansible and the SSM plugin
        if: ${{ !inputs.destroy }}
        env:
          ANSIBLE_HOME: ${{ github.workspace }}/.ansible
        run: |
          pip install -r ansible/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
          bash scripts/install-ssm-plugin.sh
      - name: Configure services, verify idempotence and check availability
        if: ${{ !inputs.destroy }}
        env:
          ANSIBLE_NOCOLOR: '1'
        run: |
          set -euo pipefail
          python scripts/inventory.py
          ansible-playbook ansible/site.yml
          ansible-playbook ansible/site.yml | tee .artifacts/idempotence.log
          python scripts/check-idempotence.py .artifacts/idempotence.log
          bash scripts/smoke-ssm.sh
      - name: Verify teardown with AWS CLI
        if: inputs.destroy
        run: python3 scripts/verify-destroy.py
